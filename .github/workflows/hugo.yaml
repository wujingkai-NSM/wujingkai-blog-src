name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.167.0'
          extended: true

      - run: hugo --minify

      - uses: peaceiris/actions-gh-pages@v4
        with:
          external_repository: wujingkai-NSM/wujingkai-NSM.github.io
          publish_branch: main
          publish_dir: ./public
          personal_token: ${{ secrets.PAGES_PUSH_TOKEN }}
          force_orphan: true
